name: "Deploy"
run-name: Deploy (${{ github.event.workflow_run.head_branch || github.ref_name }} -> ${{ inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'dev') || github.event.workflow_run.head_branch }}) by @${{ github.actor }}

on:
  workflow_run:
    workflows: ["Build Test Lint"]
    types: [completed]
    branches:
      - main
      - staging
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy to Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

jobs:
  determine-environment:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - id: set
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=$DISPATCH_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          else
            case "$BRANCH" in
              main) echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
              staging) echo "environment=staging" >> "$GITHUB_OUTPUT" ;;
              production) echo "environment=production" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  deploy:
    needs: determine-environment
    concurrency:
      group: deploy-${{ needs.determine-environment.outputs.environment }}
      cancel-in-progress: false
    uses: notch8/actions/.github/workflows/deploy.yaml@v1.0.12
    secrets: inherit
    with:
      environment: ${{ needs.determine-environment.outputs.environment }}
