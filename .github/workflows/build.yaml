name: "Build Docker Images"
on:
  workflow_dispatch:
    inputs:
      components:
        default: '["base", "solr", "web", "worker"]'
        description: "Used to set your target for the components"
        required: false
        type: string
      image_name:
        description: "Docker image name part. Fills in ghcr.io/IMAGE_NAME. Typically this is the `repo_name`, but in some projects it might be `repo_name/sub_name`"
        type: string
      os:
        default: '["ubuntu-latest", "ubuntu-24.04-arm"]'
        description: "Used to set your target for the operating system"
        required: false
        type: string
      subdir:
        default: "."
        type: string
      tag:
        required: false
        type: string
      debug_step:
        description: "Pause build to debug with tmate (ssh)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - build
          - lint
          - test
      docker_target_prefix:
        description: "Prepended to each component for Dockerfile --target (e.g. hyku- + solr => hyku-solr). Image names still use the component only."
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      components:
        default: '["base", "solr", "web", "worker"]'
        description: "Used to set your target for the components"
        required: false
        type: string
      image_name:
        description: "Docker image name part. Fills in ghcr.io/IMAGE_NAME. Typically this is the `repo_name`, but in some projects it might be `repo_name/sub_name`"
        type: string
      os:
        default: '["ubuntu-latest", "ubuntu-24.04-arm"]'
        description: "Used to set your target for the operating system"
        required: false
        type: string
      subdir:
        default: "."
        type: string
      tag:
        required: false
        type: string
      debug_step:
        required: false
        type: string
        default: ""
      docker_target_prefix:
        description: "Prepended to each component for Dockerfile --target (e.g. hyku- + solr => hyku-solr). Image names still use the component only."
        required: false
        type: string
        default: "hyku-"

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    permissions: write-all
    strategy:
      matrix:
        component: ${{fromJson(inputs.components)}}
        os: ${{fromJson(inputs.os)}}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Set platform from matrix
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "PLATFORM_TAG=amd64" >> $GITHUB_ENV
          else
            echo "PLATFORM_TAG=arm64" >> $GITHUB_ENV
          fi
      - id: setup
        name: Setup
        uses: notch8/actions/setup-env@v1.0.12
        with:
          tag: ${{ inputs.tag }}
          image_name: ${{ inputs.image_name }}
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
          subdir: ${{ inputs.subdir }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_step == 'build' }}
        with:
          limit-access-to-actor: true
      - name: Build Prep
        run: |
          echo "Preparing build environment..."
          cd "${{ inputs.subdir }}"
          if [ -f "db/schema.rb" ]; then
            chmod 777 db/schema.rb
          fi
          if [ -f "bin/checkout_all.sh" ]; then
            ./bin/checkout_all.sh
          fi
      - name: Docker meta (version + latest on default branch)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.component }}
          tags: |
            type=raw,value=${{ env.TAG }}-${{ env.PLATFORM_TAG }}
            type=raw,value=latest-${{ env.PLATFORM_TAG }},enable={{is_default_branch}}
      - name: Build and push ${{ matrix.component }} on ${{ matrix.os }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.subdir }}
          platforms: linux/${{ env.PLATFORM_TAG }}
          target: ${{ inputs.docker_target_prefix }}${{ matrix.component }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.component }}:latest
          cache-to: type=inline
          # Fork PRs get a read-only GITHUB_TOKEN and cannot write org packages,
          # so only push on same-repo events. Fork PRs still build (validating
          # the Dockerfile); instead of pushing they load the image locally so
          # it can be exported to the test/lint jobs as an artifact (see below).
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os == 'ubuntu-latest' }}
          tags: ${{ steps.meta.outputs.tags }}

      # Fork PRs can't push to GHCR, so the downstream test/lint jobs have no
      # image to pull. Hand the built image to them as a workflow artifact
      # instead. Only the amd64 leg is exported, since test/lint run on
      # ubuntu-latest; the arm leg still builds to validate the Dockerfile.
      - name: Export image tarball for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os == 'ubuntu-latest' }}
        run: |
          src="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.component }}:${{ env.TAG }}-${{ env.PLATFORM_TAG }}"
          # Retag to the platform-less tag the multiarch manifest would have
          # created (docker-compose references `:${TAG}`), which the push job
          # is skipped for on fork PRs.
          dst="${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.component }}:${{ env.TAG }}"
          docker tag "$src" "$dst"
          docker save "$dst" -o "/tmp/fork-image-${{ matrix.component }}.tar"
      - name: Upload image tarball for fork PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: fork-image-${{ matrix.component }}
          path: /tmp/fork-image-${{ matrix.component }}.tar
          retention-days: 1

  push:
    needs: build
    # Same fork-PR guard as the build step above: with nothing pushed, there
    # are no per-arch tags to assemble into a manifest.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - id: setup
        name: Setup
        uses: notch8/actions/setup-env@v1.0.12
        with:
          tag: ${{ inputs.tag }}
          image_name: ${{ inputs.image_name }}
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
          subdir: ${{ inputs.subdir }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multiarch manifests
        run: |
          platforms=()
          for os in $(echo '${{ inputs.os }}' | jq -r '.[]'); do
            if [ "$os" = "ubuntu-latest" ]; then platforms+=("amd64"); else platforms+=("arm64"); fi
          done
          for component in $(echo '${{ inputs.components }}' | jq -r '.[]'); do
            srcs=()
            for p in "${platforms[@]}"; do
              srcs+=("${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${component}:${{ env.TAG }}-${p}")
            done
            docker buildx imagetools create -t "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${component}:${{ env.TAG }}" "${srcs[@]}"
          done
      - name: Create multiarch latest manifests (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          platforms=()
          for os in $(echo '${{ inputs.os }}' | jq -r '.[]'); do
            if [ "$os" = "ubuntu-latest" ]; then platforms+=("amd64"); else platforms+=("arm64"); fi
          done
          for component in $(echo '${{ inputs.components }}' | jq -r '.[]'); do
            srcs=()
            for p in "${platforms[@]}"; do
              srcs+=("${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${component}:latest-${p}")
            done
            docker buildx imagetools create -t "${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${component}:latest" "${srcs[@]}"
          done
