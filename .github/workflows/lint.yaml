name: "Lint for Rails Projects"
on:
  workflow_dispatch:
    inputs:
      compose_file:
        description: "COMPOSE_FILE for the lint stack, colon separated. Set it where the deployed stack needs an override file, so CI runs the same configuration."
        required: false
        type: string
      rubocop_cmd:
        default: bundle exec rubocop --parallel --format progress
        required: false
        type: string
      subdir:
        default: "."
        type: string
      tag:
        required: false
        type: string
      debug_step:
        description: "Pause lint to debug with tmate (ssh); only when this workflow is run via workflow_dispatch"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      compose_file:
        description: "COMPOSE_FILE for the lint stack, colon separated. Set it where the deployed stack needs an override file, so CI runs the same configuration."
        required: false
        type: string
      rubocop_cmd:
        default: bundle exec rubocop --parallel --format progress --format junit --out rubocop.xml --display-only-failed
        required: false
        type: string
      subdir:
        default: "."
        type: string
      tag:
        required: false
        type: string
      debug_step:
        required: false
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        name: Setup
        uses: notch8/actions/setup-env@v1.0.10
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}
          subdir: ${{ inputs.subdir }}
      # Exported here rather than in the job's env block so it stays unset for a caller
      # that supplies nothing: docker compose reads an empty COMPOSE_FILE as a path and
      # fails, where an absent one lets it resolve the compose files itself.
      - name: Set COMPOSE_FILE
        if: ${{ inputs.compose_file != '' }}
        run: echo "COMPOSE_FILE=${{ inputs.compose_file }}" >> "$GITHUB_ENV"
      - name: Github Container Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3.24
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_step == 'lint' }}
        with:
          limit-access-to-actor: true
      - name: Run Rubocop
        run: >-
          cd ${{ inputs.subdir }};
          [ -f "db/schema.rb" ] && chmod 777 db/schema.rb;
          [ -f "bin/checkout_all.sh" ] && ./bin/checkout_all.sh;
          docker compose pull web || true;
          docker compose run -T web sh -c
          "${{ inputs.rubocop_cmd }}"
      - id: after_care
        name: Upload Logs and Results
        uses: notch8/actions/after-care@v1.0.10
        if: always()
        with:
          reports: "rubocop*.xml"
